name: YouTube Music guest audio probe

on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/youtube-music-probe.yml
      - tools/probe-youtube-music.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the public catalog's guest audio response
        shell: bash
        run: python3 tools/probe-youtube-music.py | tee -a "$GITHUB_STEP_SUMMARY"
