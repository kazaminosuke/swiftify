name: Native audio engine

on:
  push:
    branches: [integration]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/native-audio.yml
      - native-audio/**
      - spotify-core/Cargo.toml
      - spotify-core/Cargo.lock
      - spotify-core/src/**
      - spotify-core/vendor/**

permissions:
  contents: read

jobs:
  native-audio:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux audio build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libssl-dev pkg-config

      - name: Rust stable
        run: rustup update stable

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo +stable fmt --check --manifest-path native-audio/Cargo.toml

      - name: Lint the native engine
        if: runner.os == 'Linux'
        run: cargo +stable clippy --locked --all-targets --manifest-path native-audio/Cargo.toml -- -D warnings

      - name: Test the native engine and build its standalone player
        run: cargo +stable test --locked --all-targets --manifest-path native-audio/Cargo.toml

      - name: Verify playback through ALSA
        if: runner.os == 'Linux'
        run: |
          printf 'pcm.!default { type null }\n' > "$RUNNER_TEMP/swiftify-alsa.conf"
          ALSA_CONFIG_PATH="$RUNNER_TEMP/swiftify-alsa.conf" cargo +stable test --locked --manifest-path native-audio/Cargo.toml --test device -- --ignored
          ALSA_CONFIG_PATH="$RUNNER_TEMP/swiftify-alsa.conf" cargo +stable test --locked --manifest-path spotify-core/Cargo.toml --no-default-features --features capi --lib local_clock_tracks_dsp_and_paused_async_seek -- --ignored

      - name: Test the local core including the C ABI and DSP
        run: cargo +stable test --locked --manifest-path spotify-core/Cargo.toml --no-default-features --features capi --lib

      - name: Test the core with Spotify including the C ABI and DSP
        run: cargo +stable test --locked --manifest-path spotify-core/Cargo.toml --no-default-features --features capi,spotify --lib
